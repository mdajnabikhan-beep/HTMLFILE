<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Owner login | Aurum Luxe Salon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="awrap">
  <div class="glass alogin" id="login">
    <h2>Owner login</h2>
    <p class="sub" style="margin:0">Enter your admin password to manage bookings, services, photos and salon details.</p>
    <form class="form" id="lf">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn pri" type="submit">Log in</button>
      <p class="ok" id="lmsg" role="status"></p>
    </form>
    <p style="margin:0"><a href="index.html">Back to the salon</a></p>
  </div>
  <div class="sheet glass" id="panel" hidden>
    <header><h2>Admin panel</h2>
      <div><button class="btn pri" id="save" type="button">Save changes</button><button class="btn" id="dl" type="button">Download data.json</button><button class="btn" id="out" type="button">Log out</button></div>
    </header>
    <p class="sub" style="margin:0 0 10px"><a href="index.html" target="_blank" rel="noopener">View the salon</a>. Bookings update by themselves. Other changes go live when you press Save.</p>
    <h3>Bookings <span class="badge" id="bkn"></span></h3>
    <div id="bk"></div>
    <div id="admbody"></div>
  </div>
</main>
<div class="toast glass" id="toast" role="status"></div>
<script src="js/admin.js"></script>
</body>
</html>
